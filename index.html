<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Today</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101114'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='16' fill='%23f5f6f8' font-family='sans-serif'%3E$%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header>
      <div class="header-when">
        <p class="date" id="date"></p>
        <p class="clock" id="clock"></p>
      </div>
      <div class="view-toggle" role="group" aria-label="View">
        <button type="button" id="view-today" aria-pressed="true">Today</button>
        <button type="button" id="view-dashboard" aria-pressed="false">Dashboard</button>
      </div>
      <div class="header-actions">
        <button class="account" id="account-open" type="button">Sign in</button>
        <button class="fs" id="fullscreen" type="button" aria-pressed="false" title="Full screen (F)" aria-label="Enter full screen">
          <svg class="icon-enter" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path d="M9 4H5v4M15 4h4v4M9 20H5v-4M15 20h4v-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <svg class="icon-exit" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </header>
    <p class="notice" id="notice" hidden></p>

    <main class="stage" id="today-view">
      <p class="eyebrow" id="eyebrow">Made today</p>
      <h1 class="amount" id="amount" aria-live="polite">
        <span id="sign"></span><span id="dollars">$0</span><span class="cents" id="cents">.00</span>
      </h1>
      <div class="meter" aria-hidden="true"><span id="meter-fill"></span></div>
      <p class="of-goal" id="of-goal"></p>
      <p class="record" id="record" hidden></p>
      <div class="stats">
        <div class="stat">
          <p class="stat-label">Time left</p>
          <p class="stat-value" id="time-left">–</p>
        </div>
        <div class="stat-rule" aria-hidden="true"></div>
        <div class="stat">
          <p class="stat-label" id="gap-label">Still to go</p>
          <p class="stat-value" id="gap">–</p>
          <p class="stat-sub" id="pace"></p>
        </div>
      </div>
    </main>

    <section class="stage dashboard" id="dashboard-view" hidden>
      <div class="dash-controls">
        <label><span>Group</span>
          <select id="dash-group">
            <option value="day">Day</option>
            <option value="week">Week</option>
            <option value="month">Month</option>
            <option value="year">Year</option>
          </select>
        </label>
        <label><span>Range</span>
          <select id="dash-preset">
            <option value="week">This week</option>
            <option value="month" selected>This month</option>
            <option value="year">This year</option>
            <option value="twelve">Last 12 months</option>
            <option value="custom">Custom</option>
          </select>
        </label>
        <div class="custom-range" id="dash-custom" hidden>
          <label><span>From</span><input id="dash-start" type="date"></label>
          <label><span>To</span><input id="dash-end" type="date"></label>
        </div>
        <button class="text-button" id="download-report" type="button">Download report</button>
      </div>
      <div class="stats dash-stats">
        <div class="stat">
          <p class="stat-label">Total</p>
          <p class="stat-value" id="dash-total">$0.00</p>
        </div>
        <div class="stat-rule" aria-hidden="true"></div>
        <div class="stat">
          <p class="stat-label">Sales</p>
          <p class="stat-value" id="dash-count">0</p>
        </div>
        <div class="stat-rule" aria-hidden="true"></div>
        <div class="stat">
          <p class="stat-label">Average</p>
          <p class="stat-value" id="dash-average">$0.00</p>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="chart"></canvas></div>
    </section>

    <div class="bottom" id="today-dock">
      <div class="sales" id="sales"></div>
      <button class="text-button" id="import-sales" type="button" hidden>Import device sales</button>
      <div class="dock">
        <form class="sale-form" id="sale-form" autocomplete="off">
          <label class="field" for="sale-input">
            <span class="field-label">Sale</span>
            <input id="sale-input" inputmode="decimal" placeholder="0.00" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Completed sale amount">
          </label>
          <button class="add" type="submit" aria-label="Add sale">
            <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
              <path d="M8 2.5v11M2.5 8h11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </button>
        </form>
        <span class="divider" aria-hidden="true"></span>
        <label class="field" for="goal-input">
          <span class="field-label">Goal</span>
          <input id="goal-input" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Daily goal">
        </label>
      </div>
    </div>
  </div>

  <dialog id="auth-dialog" aria-labelledby="auth-title">
    <div class="dialog-head">
      <h2 id="auth-title">Sign in</h2>
      <button class="text-button" id="auth-close" type="button" aria-label="Close">Close</button>
    </div>
    <form id="auth-form">
      <p class="auth-message" id="auth-message"></p>
      <label class="stack" id="email-field"><span>Email</span>
        <input id="auth-email" type="email" autocomplete="username">
      </label>
      <label class="stack" id="password-field"><span>Password</span>
        <input id="auth-password" type="password" autocomplete="current-password">
      </label>
      <button class="primary" id="auth-submit" type="submit">Sign in</button>
      <div class="auth-links">
        <button id="auth-switch" type="button">Create an account</button>
        <button id="auth-reset" type="button">Forgot password</button>
      </div>
    </form>
    <div id="account-panel" hidden>
      <p class="auth-message" id="account-email"></p>
      <label class="stack"><span>New password</span>
        <input id="new-password" type="password" autocomplete="new-password">
      </label>
      <button class="primary" id="save-password" type="button">Change password</button>
      <div class="account-row">
        <button class="text-button" id="sign-out" type="button">Sign out</button>
        <button class="danger" id="delete-account" type="button">Delete account</button>
      </div>
      <label class="stack" id="delete-field" hidden><span>Type DELETE</span>
        <input id="delete-confirm" autocomplete="off">
      </label>
    </div>
  </dialog>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
